<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<script src="https://cdn.jsdelivr.net/npm/chart.js">
	</script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
	<link rel="stylesheet" th:href="@{/css/SimpleTable.css}">
	<link rel="stylesheet" th:href="@{/css/header.css}">
	<link rel="stylesheet" th:href="@{/css/RequestList.css}">
	<style>
		
		#listButton{
			width: 100%;
		}
			
		#bigButton{
			width: 150px;
		}
	</style>
<meta charset="UTF-8">
<title>依頼管理システム-依頼一覧</title>
</head>
<body>
	<div th:replace="~{Hedder :: header}"></div>
	
	<h2>■依頼一覧</h2>
<!--★表のソート-->
<div>
	期間：
    <button onclick="location.href='/requestList'">すべて</button>
    <button onclick="location.href='/requestList?period=today'">今日</button>
    <button onclick="location.href='/requestList?period=week'">一週間</button>
    <button onclick="location.href='/requestList?period=month'">一か月</button>
    <button onclick="location.href='/requestList?period=year'">一年</button>
	<br><br>
	
	状態：
	<button onclick="location.href='/requestList'">すべて</button>
	    <button onclick="location.href='/requestList?status=active'">制作中</button>
	    <button onclick="location.href='/requestList?status=completed'">完了</button>
		<form action="/requestList" method="get">
　　<br>
	<!--詳細検索-->
		    <!-- 依頼者 -->
		    <label for="clientName">依頼者</label>

			<input
			    type="text"
			    id="clientName"
			    name="clientName"
			    list="clientNameList"
			    placeholder="入力 or 候補から選択"
				th:value="${selectedClientName}">

				<datalist id="clientNameList">
				    <option th:each="name : ${clientNames}"
				            th:value="${name}">
					</option>
				</datalist>

		    <!-- 依頼種類 -->
		    <label>依頼の種類</label>
		    <select name="kind">
		        <option value="">すべて</option>
		        <option th:each="kind : ${kinds}"
		                th:value="${kind}"
		                th:text="${kind}"
						th:selected="${kind == selectedKind}">
		        </option>
		    </select>
			
			<!-- 依頼詳細 -->
				    <label>種類の詳細</label>
				    <select name="kindDetail">
				        <option value="">すべて</option>
				        <option th:each="kindDetail : ${kindDetails}"
				                th:value="${kindDetail}"
				                th:text="${kindDetail}"
								th:selected="${kindDetail == selectedKindDetail}">
				        </option>
				    </select>

		    <!-- 状態 -->
		    <label>状態</label>
			<select name="status">
			    <option value=""
			            th:selected="${selectedStatus == null or selectedStatus == ''}">
			        すべて
			    </option>
			    <option value="開始前"
			            th:selected="${selectedStatus == '開始前'}">開始前</option>
			    <option value="制作中"
			            th:selected="${selectedStatus == '制作中'}">制作中</option>
			    <option value="完了"
			            th:selected="${selectedStatus == '完了'}">完了</option>
			</select>

		    <!-- 作業時間 -->
			<label>作業時間</label>
			<input type="number"
			       name="minWorkTime"
			       min="0"
			       placeholder="60"
			       style="width: 40px;"
			       th:value="${selectedMinWorkTime}">
			<span>分以上</span>

			<button id="bigButton",type="submit">検索</button>
			<button type="button"
						        onclick="location.href='/requestList'">
						    条件をクリア
						</button>

		</form>
</div>

<!-- 表示内容 -->
    <h3>
        表示中の内容：
        <span th:text="${displayCondition}"></span>
    </h3>
</div>

	


<!-- 【カード】検索条件に一致する依頼の集計 -->
<div class="summary-container">

	<!-- ① 依頼完了件数 -->
		    <div class="summary-item summary-count">
		        <div class="summary-label">依頼完了件数</div>

		        <div class="summary-value">
		            <span class="summary-number"
		                  th:text="${summary.completedCount}"></span>
		            <span class="summary-unit">件</span>
		        </div>

		        <div class="summary-note">
		            ＋進行中：<span th:text="${summary.inProgressCount}"></span>件
		        </div>
		    </div>

		    <!-- ② 合計金額 -->
		    <div class="summary-item summary-price">
		        <div class="summary-label">合計金額</div>

		        <div class="summary-value">
		            <span class="summary-number"
		                  th:text="${#numbers.formatInteger(summary.totalPrice + summary.totalTip, 1, 'COMMA')}"></span>
		            <span class="summary-unit">マー</span>
		        </div>

		        <div class="summary-note">
		            報酬：<span th:text="${#numbers.formatInteger(summary.totalPrice, 1, 'COMMA')}"></span>マー
		            ＋チップ：<span th:text="${#numbers.formatInteger(summary.totalTip, 1, 'COMMA')}"></span>マー
		        </div>
		    </div>

		    <!-- ③ 作業時間合計 -->
		    <div class="summary-item summary-time">
		        <div class="summary-label">作業時間合計</div>

		        <div class="summary-value">
		            <span class="summary-number"
		                  th:text="${summary.totalWorkTime / 60}"></span>
		            <span class="summary-unit">h</span>

		            <span class="summary-number"
		                  th:text="${summary.totalWorkTime % 60}"></span>
		            <span class="summary-unit">m</span>
				</div>
				<div class="summary-note">
					時給：<span th:text="${summary.hourlyWage}"></span>マー/h          
		        </div>
		    </div>
			


			<!-- ④ 平均作業日数 -->
			<div class="summary-item summary-average-days">
			    <div class="summary-label">平均作業日数</div>


				<div class="summary-value">
				    <span class="summary-number"
				          th:text="${workDaysSummary.averageWorkDays != null
				              ? #numbers.formatDecimal(workDaysSummary.averageWorkDays, 1, 1)
				              : '-'}"></span>
				    <span class="summary-unit">日（平均）</span>
				</div>

				<div class="summary-note">
				    最短：
				    <span th:text="${workDaysSummary.minWorkDays != null
				        ? workDaysSummary.minWorkDays : '-'}"></span>日
				    ／
				    最長：
				    <span th:text="${workDaysSummary.maxWorkDays != null
				        ? workDaysSummary.maxWorkDays : '-'}"></span>日
				</div>

			</div>



</div>

<!--【グラフ】円グラフ-->
	<!-- 円グラフエリア -->
	<div class="chart-area">

	    <div class="chart-pair">
	        <div class="chart-item">
	            <h3>依頼種類ごとの件数割合</h3>
				<div class="chart-row">
	            <div class="chart-canvas">
	                <canvas id="kindCountChart"></canvas>
	            </div>
				</div>
	        </div>

	        <div class="chart-item">
	            <h3>依頼種類ごとの金額割合</h3>
				<div class="chart-row">
	            <div class="chart-canvas">
	                <canvas id="priceChart"></canvas>
	            </div>
				</div>
	        </div>

	    </div>

	    <!-- 2つのグラフで共通の凡例 -->
	    <div id="sharedLegend" class="shared-legend"></div>

	</div>




	
<!--★表の表示-->
	<table>
	    <thead>
	        <tr>
	            <th>依頼ID</th>
	            <th>依頼の種類</th>
	            <th>詳細</th>
				<th>キャラ名</th>
				<th>依頼者</th>
	            <th>金額</th>
	            <th>チップ</th>
				<th>作業時間</th>
	            <th>受付日</th>
	            <th>完了日</th>
	            <th>状態</th>
				<th>メモ</th>
				<th>修正</th>
				<th>作業内容</th>
	        </tr>
	    </thead>

	    <tbody>
			<!--for文の仲間。trの中身を件数の数だけ繰り返す。-->
	        <tr th:each="request : ${requestList}">
	            <td th:text="${request.id}"></td>
	            <td th:text="${request.Kind != null ? request.Kind : '-'}"></td>
	            <td th:text="${request.KindDetail != null ? request.KindDetail : '-'}"></td>
				<td th:text="${request.chara != null ? request.chara : '-'}"></td>
				<td th:text="${request.clientName}"></td>
	            <td th:text="${request.price} + 'マー'"></td>
	            <td th:text="${request.tip != null ? request.tip + 'マー' : '-'}"></td>
	            <td th:text="${request.workTimeDisplay != null ? request.workTimeDisplay : '-'}"></td>
				<td th:text="${request.receivedDay}"></td>
	            <td th:text="${request.completedDay}"></td>
	            <td th:text="${request.status}"></td>
				<td class="memo-cell" th:text="${request.memo}"></td>
				<td><button id="listButton" th:onclick="|location.href='/requestUpdate?id=${request.id}'|">
					✿</button>
				</td>
				<td><button id="listButton" th:onclick="|location.href='/workLogEachList?id=${request.id}'|">
					☆</button>
				</td>
	        </tr>
	    </tbody>
	</table>
	<br>
	<button id = backButton onclick="location.href='/home'">ホームへ戻る</button>

<!--円グラフのデータ・設定部分-->

<script th:inline="javascript">
    // Controllerから渡されたデータ
	const kindCountList = /*[[${kindCountList}]]*/ [];
	const kindPriceList = /*[[${kindPriceList}]]*/ [];

	// 2つのデータに登場する依頼種類をまとめる
	const kinds = [...new Set([
	    ...kindCountList.map(item => item.kind ?? '未分類'),
	    ...kindPriceList.map(item => item.kind ?? '未分類')
	])];

	// 依頼種類ごとに固定する色
	const palette = [
	'#7FA7D8',
	  '#8FC5AE',
	  '#E7BD73',
	  '#D99BA5',
	  '#B3A0D9',
	  '#8CBFC5',
	  '#C5A38A',
	  '#BDBDBD'
	];

	const colorMap = Object.fromEntries(
	    kinds.map((kind, index) => [
	        kind,
	        palette[index % palette.length]
	    ])
	);

	// 種類の順番を両グラフで統一する
	const countMap = Object.fromEntries(
	    kindCountList.map(item => [item.kind ?? '未分類', item.count])
	);

	const priceMap = Object.fromEntries(
	    kindPriceList.map(item => [item.kind ?? '未分類', item.totalPrice])
	);
	

	const colors = kinds.map(kind => colorMap[kind]);


	const commonOptions = {
	    responsive: true,
	    maintainAspectRatio: false,
	    devicePixelRatio: 1,

	    plugins: {
	        legend: {
	            display: false
	        },
			tooltip: {
			    titleFont: {
			        size: 0
			    },
			    bodyFont: {
			        size: 15
			    },
			    padding: 6,
			    boxPadding: 3,
			    caretSize: 5,
			    cornerRadius: 4,

			    callbacks: {
			        label: function(context) {
			            const data = context.dataset.data;
			            const total = data.reduce(
			                (sum, value) => sum + Number(value), 0
			            );

			            const percentage = total > 0
			                ? (context.parsed / total * 100).toFixed(1)
			                : '0.0';

			            return `${context.label}: ${context.formattedValue}（${percentage}%）`;
			        }
			    }
			}
	    }
	};

	// 件数の円グラフ
	new Chart(document.getElementById('kindCountChart'), {
	    type: 'pie',
	    data: {
	        labels: kinds,
	        datasets: [{
	            data: kinds.map(kind => countMap[kind] ?? 0),
	            backgroundColor: colors
	        }]
	    },
	    options: commonOptions
	});

	// 金額の円グラフ
	new Chart(document.getElementById('priceChart'), {
	    type: 'pie',
	    data: {
	        labels: kinds,
	        datasets: [{
	            data: kinds.map(kind => priceMap[kind] ?? 0),
	            backgroundColor: colors
	        }]
	    },
	    options: commonOptions
	});

	// 共通凡例を作成する
	document.getElementById('sharedLegend').innerHTML =
	    kinds.map(kind => `
	        <div class="legend-item">
	            <span class="legend-color"
	                  style="background-color: ${colorMap[kind]}"></span>
	            <span>${kind}</span>
	        </div>
	    `).join('');
</script>

</body>
</html>
