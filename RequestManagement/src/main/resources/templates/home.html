<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/SimpleTable.css}">
	<link rel="stylesheet" th:href="@{/css/header.css}">
	<style>
	/*	ラベルの幅を固定することで間隔を統一*/
	label {
	display: inline-block;
	width: 100px;
	}
	
	#bigButton{
		font-size: 25px;
				width: 675px;
				height: 60px;
	}
				
	#registerButton{
		font-size: 20px;
		width: 330px;
		height: 45px;
	}
	
	#listButton{
		width: 100%;
	}
	
	</style>
<meta charset="UTF-8">


<title>依頼管理システム-ホーム</title>
</head>


<body>
	
	<div th:replace="~{Hedder :: header}"></div>
	
<!--	<h2>■ホーム</h2>-->
	<!--▼ここにフラッシュメッセージを表示-->
	<h3 th:if="${message}" th:text="${message}" style="background-color:rgb(47, 208, 152); color: rgb(255, 255, 255);"></h3>
	<h3 th:if="${workMessage}" th:text="${workMessage}" style="background-color:rgb(249, 206, 9); color: rgb(255, 255, 255);"></h3>
	<h3 th:if="${updateMessage}" th:text="${updateMessage}" style="background-color:rgb(164, 250, 69); color: rgb(255, 255, 255);"></h3>
	<h3 th:if="${deleteMessage}" th:text="${deleteMessage}" style="background-color:rgb(254, 131, 124); color: rgb(255, 255, 255);"></h3>
	
	

	<!-- 集計表示 -->
	<div class="summary-container">

	    <!-- ① 依頼完了件数 -->
	    <div class="summary-item summary-count">
	        <div class="summary-label">依頼完了件数</div>

	        <div class="summary-value">
	            <span class="summary-number"
	                  th:text="${summary.completedCount}"></span>
	            <span class="summary-unit">件</span>
	        </div>

	        <div class="summary-note">
	            ＋進行中：<span th:text="${summary.inProgressCount}"></span>件
	        </div>
	    </div>

	    <!-- ② 合計金額 -->
	    <div class="summary-item summary-price">
	        <div class="summary-label">合計金額</div>

	        <div class="summary-value">
	            <span class="summary-number"
	                  th:text="${#numbers.formatInteger(summary.totalPrice + summary.totalTip, 1, 'COMMA')}"></span>
	            <span class="summary-unit">マー</span>
	        </div>

	        <div class="summary-note">
	            報酬：<span th:text="${#numbers.formatInteger(summary.totalPrice, 1, 'COMMA')}"></span>マー
	            ＋チップ：<span th:text="${#numbers.formatInteger(summary.totalTip, 1, 'COMMA')}"></span>マー
	        </div>
	    </div>

	    <!-- ③ 作業時間合計 -->
	    <div class="summary-item summary-time">
	        <div class="summary-label">作業時間合計</div>

	        <div class="summary-value">
	            <span class="summary-number"
	                  th:text="${summary.totalWorkTime / 60}"></span>
	            <span class="summary-unit">h</span>

	            <span class="summary-number"
	                  th:text="${summary.totalWorkTime % 60}"></span>
	            <span class="summary-unit">m</span>
			</div>
			<div class="summary-note">
				時給：<span th:text="${summary.hourlyWage}"></span>マー/h          
	        </div>
	    </div>

	</div>

	
	
	
	
<!--▼CSS抜きの表示ver-->
<!--	<p>依頼完了件数：<span th:text="${summary.completedCount}"></span>件-->
<!--	   (＋進行中：<span th:text="${summary.inProgressCount}"></span>件)</p>-->
<!--	<p>合計金額：<span th:text="${summary.totalPrice + summary.totalTip}"></span>マー-->
<!--	  (報酬：<span th:text="${summary.totalPrice}"></span>マー-->
<!--	   +チップ：<span th:text="${summary.totalTip}"></span>マー)</p>-->
<!--	<p>作業時間合計：<span th:text="${summary.workTimeDisplay}"></span></p>-->
	
	
	<!--グラフ表示-->
	<div>
	    <h2>月別集計</h2>
	
		<div style="position: relative; height: 200px; width: 920px;">
		    <canvas id="monthlyChart"></canvas>
		</div>
		
	<!--ソート用のボタン-->
		<div style="width: 920px; display: flex; gap: 15px; justify-content: center;">
		    <button type="button" onclick="location.href='/home?period=all'">
		        すべて
		    </button>

		    <button type="button" onclick="location.href='/home?period=3months'">
		        3か月
		    </button>

		    <button type="button" onclick="location.href='/home?period=6months'">
		        半年
		    </button>

		    <button type="button" onclick="location.href='/home?period=year'">
		        1年
		    </button>
		</div>
    
	<!--ボタン-->
<!--	<br>-->
<!--	<button id = bigButton onclick="location.href='/register'">依頼登録</button><br><br>-->
<!--	<div style="display: flex; gap: 15px;">-->
<!--	<button id = registerButton onclick="location.href='/requestList'">依頼一覧</button>-->
<!--	<button id = registerButton onclick="location.href='/workLogAllList'">作業内容一覧</button>-->
<!--	</div>-->
	
	
	<!--表-->
	<br>
	<h3>✿進行中の依頼</h3>
	<table>
		    <thead>
		        <tr>
		            <th>依頼ID</th>
		            <th>残り日数</th>
		            <th>依頼の種類</th>
			        <th>詳細</th>
			        <th>キャラ名</th>
		            <th>依頼者</th>
					<th>報酬</th>
		            <th>進捗</th>
					<th>作業登録</th>	
					<th>作業一覧</th>		     
                </tr>
		    </thead>

		    <tbody>
				<!--for文の仲間。trの中身を件数の数だけ繰り返す。-->
		        <tdtr th:each="request : ${requestList}" th:if="${request.status != '完了'}">
		            <td th:text="${request.id}"></td>
					<td th:text="${request.remainingDays != null ? request.remainingDays : '-'}"
					    th:class="${request.remainingDays != null and request.remainingDays < 7 ? 'deadline-warning deadline-danger' :
					               (request.remainingDays != null and request.remainingDays < 14 ? 'deadline-warning' : '')}">
					</td>
		            <td th:text="${request.Kind != null ? request.Kind : '-'}"></td>
		            <td th:text="${request.KindDetail != null ? request.KindDetail : '-'}"></td>
					<td th:text="${request.chara != null ? request.chara : '-'}"></td>
					<td th:text="${request.clientName}"></td>
		            <td th:text="${request.price} + 'マー'"></td>
					<td th:text="${request.progress} + '%'"></td>
					<td><button id="listButton" th:onclick="|location.href='/workLogRegister?id=${request.id}'|">
						★</button>
					</td>
					<td><button id="listButton" th:onclick="|location.href='/workLogEachList?id=${request.id}'|">
					    ☆
					</button>
					</td>
		        </tr>
		    </tbody>
		</table>
	
		
	<!--グラフ用-->
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

	<script th:inline="javascript">

	    const monthlySummary = /*[[${monthlySummary}]]*/ [];

	    const labels = monthlySummary.map(monthly => monthly.month);

	    const totalPrices = monthlySummary.map(monthly => monthly.totalPrice);

	    const completedCounts = monthlySummary.map(monthly => monthly.completedCount);

		
		// 表示期間に応じて棒の太さを変更
		const barWidth = labels.length <= 3 ? 80
		               : labels.length <= 6 ? 60
					   : labels.length <= 12 ? 40
					   : labels.length <= 15 ? 35
					   : labels.length <= 20 ? 30
					   : labels.length <= 25 ? 25
					   : labels.length <= 30 ? 20
					   : labels.length <= 35 ? 15
					   : labels.length <= 40 ? 10
		               : 5;
		
		
	    new Chart(document.getElementById('monthlyChart'), {

	        type: 'line',

	        data: {
	            labels: labels,

				datasets: [
				    {
				        label: '依頼金額',
						order: 2,
				        data: totalPrices,
						type: 'bar',
				        yAxisID: 'price',
				        borderColor: 'rgb(234, 200, 38)',
				        backgroundColor:  'rgb(234, 200, 38)',
						barThickness: barWidth,
						maxBarThickness: barWidth,
				    },
					{
					    label: '完了件数',
						order: 1,
					    data: completedCounts,
					    backgroundColor: '#94adda',
					    borderColor: '#94adda',
					    borderWidth: 5,
					    yAxisID: 'count',
						pointRadius: 5,
						pointHoverRadius: 8,
						pointHitRadius: 12,
						
					}
				]
	        },

			options: {
			    responsive: true,
				maintainAspectRatio: false,
				devicePixelRatio: 1,
				
				
			    scales: {
					price: {
					    type: 'linear',
					    position: 'left',
					},
					count: {
					    type: 'linear',
					    position: 'right',
					    min: 0,
						max: 15,
					    ticks: {
					        stepSize: 1
					    }
					}
			    },
				plugins: {
				    legend: {
				        labels: {
				            font: {
				                size: 14
				            }
				        }
				    },
				    tooltip: {
				        titleFont: {
				            size: 14
				        },
				        bodyFont: {
				            size: 14
				        },
				        footerFont: {
				            size: 13
				        }
				    }
				}
			}

	    });

	</script>

	</body>
</html>
